[package]
name = "misag"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "misag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# The GTK that Tauri runs on, to read the primary selection (see commands::primary_selection).
gtk = "0.18"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

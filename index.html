<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>raterm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <nav id="tabbar">
      <button id="toggle-sidebar" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="tabs"></div>
      <button id="new-session" title="New tab (Shift+click: custom)">+</button>
    </nav>
    <div id="content">
      <aside id="sidebar"></aside>
      <main id="terminals"></main>
    </div>

    <dialog id="spawn-dialog">
      <form method="dialog">
        <input name="name" placeholder="Name (optional)" />
        <input name="cwd" placeholder="Working directory (default: $HOME)" />
        <input name="command" placeholder="Command (default: login shell), e.g. claude" />
        <menu>
          <span class="spacer"></span>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="ok" class="primary">Start</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

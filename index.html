<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>raterm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <nav id="tabbar">
      <button id="toggle-sidebar" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="tabs"></div>
      <!-- Buttons for opening new tabs, one per tab kind. -->
      <div id="tab-actions">
        <button id="new-claude" title="New Claude session (Shift+click: choose name and directory)"></button>
      </div>
    </nav>
    <div id="notice" role="status" hidden><span></span><button title="Dismiss">✕</button></div>
    <div id="content">
      <aside id="sidebar">
        <button id="open-settings" title="Settings"><span class="icon"></span>Settings</button>
      </aside>
      <main id="terminals">
        <p id="empty-state">No tabs open. Start a Claude session with the button at the top right.</p>
        <!-- The settings tab's page, shown in place of the terminals (see showActive in main.ts). Every change is saved right away. -->
        <section id="settings" class="page" aria-label="Settings" tabindex="-1">
          <form novalidate>
            <fieldset>
              <h2>Claude</h2>
              <label class="check"><input name="skipPermissions" type="checkbox" /> Skip permission prompts (<code>--dangerously-skip-permissions</code>)</label>
              <p class="hint">Claude then runs every tool without asking. Applies to Claude tabs started or restarted from now on, which show a red <b>!</b>.</p>
            </fieldset>
            <p class="hint not-saving" hidden>raterm is running without its database, so settings last only until it quits.</p>
            <p class="error" role="alert" hidden></p>
          </form>
        </section>
      </main>
    </div>

    <dialog id="spawn-dialog">
      <form method="dialog">
        <h2>New Claude session</h2>
        <input name="name" placeholder="Name (optional)" />
        <input name="cwd" placeholder="Working directory (default: current tab's, or $HOME)" />
        <menu>
          <span class="spacer"></span>
          <!-- Start comes first so Enter submits it; CSS moves it to the end. -->
          <button value="ok" class="primary">Start</button>
          <button value="cancel" formnovalidate>Cancel</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Release

# Push a tag such as v0.1.0 to build every platform into one draft GitHub Release.
# Publishing it is left to a person: open the draft once every job has passed (a
# failed job leaves its platform's installer out) and press Publish.
# Run it by hand (Actions > Release > Run workflow) to build every platform without
# a release: the packages are kept as the run's artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          # Apple Silicon (M-series) Macs.
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: windows-latest
            args: '--bundles msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Check that the tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            have=$(node -p "require('./$file').version")
            [ "$have" = "$want" ] || { echo "::error::$file has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$have" = "$want" ] || { echo "::error::src-tauri/Cargo.toml has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The Rust tests need the built page, which the app embeds.
      - run: pnpm build

      # Windows terminals only wait for, and show the output of, console programs, so
      # the app ships its console build misag-cli.exe beside it.
      - name: Build the console misag for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/build-windows-cli.sh

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mischief of Agents {0}', github.ref_name) || '' }}
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

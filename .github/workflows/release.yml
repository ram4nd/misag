name: Release

# Push an annotated tag such as v0.1.0 to build every platform into one published
# GitHub Release, whose text is the tag's message (git tag -a v0.1.0 -m "..."). A
# failed job leaves its platform's installer out of the release.
# Run it by hand (Actions > Release > Run workflow) to build every platform without
# a release: the packages are kept as the run's artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
            os: Linux_x64
          # Apple Silicon (M-series) Macs.
          - platform: macos-latest
            args: '--bundles app,dmg'
            os: macOS_Apple-Silicon
          - platform: windows-latest
            args: '--bundles msi'
            os: Windows_x64
    runs-on: ${{ matrix.platform }}
    env:
      # Only macOS builds from main or a version tag get the Apple signing secrets, so
      # a run of another branch cannot sign its code as ours. Not named SIGN: the
      # AppImage bundler GPG-signs when a variable of that name is set at all.
      MISAG_SIGN_MACOS: ${{ matrix.platform == 'macos-latest' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Check that the tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            have=$(node -p "require('./$file').version")
            [ "$have" = "$want" ] || { echo "::error::$file has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$have" = "$want" ] || { echo "::error::src-tauri/Cargo.toml has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The Rust tests need the built page, which the app embeds.
      - run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Signs with the Developer ID certificate and notarizes with Apple, so Gatekeeper
      # opens the app without a warning. Handed to the build step only, after the
      # tests, and never empty: a missing secret would quietly build an unsigned app.
      - name: Apple signing credentials
        if: env.MISAG_SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is empty, so the app would not be signed and notarized"; exit 1; }
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # actions/checkout can leave an annotated tag as a lightweight one, so fetch it
      # again to read its message.
      - name: Release text from the tag's message
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # A lightweight tag's contents would be its commit's message instead.
          body=$(git tag -l --format='%(if:equals=tag)%(objecttype)%(then)%(contents)%(end)' "$GITHUB_REF_NAME")
          [ -n "$body" ] || body='Download the installer for your platform from the assets below.'
          { echo 'body<<MISAG_EOF'; echo "$body"; echo 'MISAG_EOF'; } >> "$GITHUB_OUTPUT"

      # Pinned to v1's commit, since this step gets the signing credentials.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mischief of Agents {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # Names say which computer each installer is for, such as an M-series Mac.
          releaseAssetNamePattern: Mischief-of-Agents_[version]_${{ matrix.os }}[ext]
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

      - name: Check that the app is signed and notarized
        if: env.MISAG_SIGN_MACOS == 'true'
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/Mischief of Agents.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # tauri-action also uploads the macOS app as .app.tar.gz, for Tauri's updater,
      # which misag does not use; the .dmg is the installer.
      - name: Remove the updater archive from the release
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".app.tar.gz")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done

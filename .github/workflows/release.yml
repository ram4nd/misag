name: Release

# Push a tag such as v0.1.0 to build every platform into one draft GitHub Release.
# Publishing it is left to a person: open the draft once every job has passed (a
# failed job leaves its platform's installer out) and press Publish.
# Run it by hand (Actions > Release > Run workflow) to build every platform without
# a release: the packages are kept as the run's artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
            os: Linux_x64
          # Apple Silicon (M-series) Macs.
          - platform: macos-latest
            args: '--bundles app,dmg'
            os: macOS_Apple-Silicon
          - platform: windows-latest
            args: '--bundles msi'
            os: Windows_x64
    runs-on: ${{ matrix.platform }}
    # Well above a normal build and notarization, so a hung one does not hold a runner for hours.
    timeout-minutes: 90
    env:
      # Only macOS builds from main or a version tag get the Apple signing secrets, so
      # a run of another branch cannot sign its code as ours. Not named SIGN: the
      # AppImage bundler GPG-signs when a variable of that name is set at all.
      MISAG_SIGN_MACOS: ${{ matrix.platform == 'macos-latest' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      # Without persisted credentials, so the job's write token is not left in .git/config
      # for dependency code to read; the steps that need it are given it explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needs the checkout above, since it is a local action.
      - uses: ./.github/actions/setup
        with:
          # The AppImage bundler needs these.
          extra-apt-packages: patchelf xdg-utils

      - name: Check that the tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            have=$(node -p "require('./$file').version")
            [ "$have" = "$want" ] || { echo "::error::$file has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$have" = "$want" ] || { echo "::error::src-tauri/Cargo.toml has version $have, but the tag is $GITHUB_REF_NAME"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The Rust tests need the built page, which the app embeds.
      - run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # Fails the job when a signing secret is empty, as the app would then quietly build
      # unsigned. The signing itself (Developer ID certificate, notarization with Apple,
      # so Gatekeeper opens the app without a warning) happens in the signed build step.
      # The secrets go only to that step's env, never $GITHUB_ENV, so other steps and the
      # actions' post steps do not get them. The build that step runs still does: its
      # Cargo build scripts, `pnpm build` and Vite plugins see them, so a compromised
      # dependency could read them there (the bundler needs them in its environment).
      - name: Check the Apple signing credentials
        if: env.MISAG_SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is empty, so the app would not be signed and notarized"; exit 1; }
          done

      # Two copies of the build step, signed and unsigned, because the bundler reads a
      # set but empty APPLE_* variable as given (an empty APPLE_SIGNING_IDENTITY
      # replaces the ad-hoc "-" identity in tauri.conf.json and codesign fails), so the
      # unsigned build must not have them at all. The unsigned copy reuses this step's
      # `with:` through the &tauri-with anchor, so only their env differs. Both are pinned
      # to v1's commit, as the signed one gets the signing credentials.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri-signed
        if: env.MISAG_SIGN_MACOS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with: &tauri-with
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mischief of Agents {0}', github.ref_name) || '' }}
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          # Names say which computer each installer is for, such as an M-series Mac.
          releaseAssetNamePattern: Mischief-of-Agents_[version]_${{ matrix.os }}[ext]
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri-unsigned
        if: env.MISAG_SIGN_MACOS != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: *tauri-with

      - name: Check that the app is signed and notarized
        if: env.MISAG_SIGN_MACOS == 'true'
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/Mischief of Agents.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # tauri-action also uploads the macOS app as .app.tar.gz, for Tauri's updater,
      # which misag does not use; the .dmg is the installer.
      - name: Remove the updater archive from the release
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-signed.outputs.releaseId || steps.tauri-unsigned.outputs.releaseId }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".app.tar.gz")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done

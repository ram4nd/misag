name: Release

# Push a tag such as v0.1.0 to build every platform into one draft GitHub Release,
# then publish the draft on GitHub once all jobs have finished.
# Run it by hand (Actions > Release > Run workflow) to build every platform without
# a release: the packages are kept as the run's artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          # Apple Silicon (M-series) Macs.
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: windows-latest
            args: '--bundles msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Windows terminals only wait for, and show the output of, console programs, so
      # the app ships its console build `misag-cli.exe` beside it (see
      # src-tauri/tauri.windows.conf.json). The build script wants the file present
      # before it can build it, so a placeholder stands in first.
      - name: Build the console misag for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm build
          cd src-tauri
          mkdir -p binaries
          touch binaries/misag-cli-x86_64-pc-windows-msvc.exe
          cargo build --release --bin misag-cli
          cp target/release/misag-cli.exe binaries/misag-cli-x86_64-pc-windows-msvc.exe

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mischief of Agents {0}', github.ref_name) || '' }}
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

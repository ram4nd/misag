name: CI

# Runs the frontend and Rust tests, the build and clippy on every push to main and
# every pull request; the Release workflow builds the installers.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's older runs are cancelled, so every push to main gets a finished result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Needs the checkout above, since it is a local action.
      - uses: ./.github/actions/setup
        with:
          rust-components: clippy

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The Rust crate embeds the built page, so it must exist before clippy and the tests.
      - run: pnpm build

      # Linux only, to keep the macOS and Windows jobs short.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # A failure is repeated as an annotation, which anyone can read through the API,
      # unlike the logs, which need a GitHub login.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee rust-tests.log; then
            node -e '
              const log = require("fs").readFileSync("rust-tests.log", "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              // The failed tests, else the first compile error, else the end of the log.
              let at = log.indexOf("\nfailures:\n");
              if (at < 0) at = log.search(/\nerror(\[|:)/);
              const text = (at >= 0 ? log.slice(at) : log.slice(-6000)).slice(0, 6000);
              const esc = text.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log("::error title=Rust tests failed::" + esc);
            '
            exit 1
          fi

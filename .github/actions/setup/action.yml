name: Set up the build
description: Installs pnpm, Node, the Rust toolchain with its cache and the Linux libraries the app builds against. Shared by the CI and Release workflows.

inputs:
  rust-components:
    description: Comma-separated Rust components to install as well, such as clippy.
    required: false
    default: ''
  extra-apt-packages:
    description: Space-separated Linux packages to install besides the build libraries, such as the bundlers' tools.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 12

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: lts/*
        cache: pnpm

    # Pinned to a commit of its stable branch, which has no version tags, so Dependabot
    # may not bump it: update it by hand now and then.
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        # Floats on purpose, so new toolchains and lints show up early (in CI, new clippy
        # lints fail the job).
        toolchain: stable
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: src-tauri

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_APT_PACKAGES: ${{ inputs.extra-apt-packages }}
      run: |
        sudo apt-get update
        # Unquoted on purpose: the input is a space-separated list.
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev $EXTRA_APT_PACKAGES
